<title>Mood Almanac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: photos lead, chrome recedes. Monochrome UI on a clean ground; all colour comes from the
   photos (cover images, a palette aura behind each board title, paint-chip swatches). Controls live
   in one floating glass dock. */
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --ink: #121212;
  --muted: #74716c;
  --faint: #a9a6a0;
  --line: #e8e6e2;
  --glass: rgb(255 255 255 / .74);
  --glass-line: rgb(0 0 0 / .07);
  --danger: #c2412d;
  --stage: #070707;
  --stage-ink: #f2f1ee;
  --stage-muted: #8e8b86;
  --aura: .42;
  --shadow: 0 1px 1px rgb(0 0 0 / .04), 0 12px 32px -12px rgb(0 0 0 / .16);
  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #161616; --ink: #f3f2ef; --muted: #8f8c87; --faint: #5d5b58; --line: #252423;
    --glass: rgb(30 30 30 / .72); --glass-line: rgb(255 255 255 / .08); --danger: #ef7a62; --aura: .3;
    --shadow: 0 1px 1px rgb(0 0 0 / .3), 0 14px 36px -12px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --surface: #161616; --ink: #f3f2ef; --muted: #8f8c87; --faint: #5d5b58; --line: #252423;
  --glass: rgb(30 30 30 / .72); --glass-line: rgb(255 255 255 / .08); --danger: #ef7a62; --aura: .3;
  --shadow: 0 1px 1px rgb(0 0 0 / .3), 0 14px 36px -12px rgb(0 0 0 / .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--kc, var(--muted)); display: inline-block; }

/* ---------- Top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.mark { font-family: var(--font-display); font-size: 25px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; margin-right: auto; line-height: 1; }
.mark em { font-style: italic; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; transition: transform .15s, background .15s, border-color .15s; }
.btn:hover { border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.dark:hover { opacity: .88; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.btn.red { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.redtext { color: var(--danger); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg { width: 17px; height: 17px; flex: none; }
.round { width: 40px; padding: 0; }
.banner { font-size: 13px; color: var(--muted); padding-block: 6px; }
.banner:empty { display: none; }

/* ---------- Home ---------- */
.mast { padding-block: clamp(36px, 7vw, 88px) clamp(24px, 4vw, 44px); display: grid; gap: 18px; }
.mast h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(48px, 9vw, 120px); line-height: .92; letter-spacing: -.025em; margin: 0; text-wrap: balance; max-width: 14ch; }
.mast h1 em { font-style: italic; color: var(--muted); }
.mast p { margin: 0; color: var(--muted); font-size: 16px; max-width: 46ch; }

.tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 0 0 12px; font-size: 14px; color: var(--muted); white-space: nowrap; position: relative; display: inline-flex; align-items: center; gap: 7px; }
.tab sup { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
.tab[aria-pressed="true"] { color: var(--ink); }
.tab[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }

.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 44px 22px; padding-bottom: 96px; }
.card { display: grid; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.cover { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 16px; overflow: hidden; background: var(--line); }
.cover > img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
.card:hover .cover > img { transform: scale(1.04); }
.cover .thumbs { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.cover .thumbs img { width: 38px; height: 38px; border-radius: 8px; border: 2px solid rgb(255 255 255 / .9); object-fit: cover; display: block; }
.cover .chips { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 3px; padding: 5px 7px; border-radius: 999px; background: rgb(255 255 255 / .78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.cover .chips i { width: 10px; height: 10px; border-radius: 50%; }
.cover.empty { display: grid; place-items: center; background: radial-gradient(120% 90% at 20% 10%, color-mix(in srgb, var(--kc) 55%, var(--bg)), transparent 60%), radial-gradient(100% 80% at 90% 100%, color-mix(in srgb, var(--kc) 30%, var(--bg)), var(--surface)); }
.cover.empty span { font-family: var(--font-display); font-style: italic; font-size: 22px; color: color-mix(in srgb, var(--kc) 55%, var(--ink)); }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.05; letter-spacing: -.01em; margin: 0; overflow-wrap: anywhere; }
.card .eyebrow { gap: 8px; }
.newcard { border: 1px dashed var(--faint); border-radius: 16px; aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-content: center; justify-items: center; gap: 10px; background: transparent; color: var(--muted); font-size: 14px; transition: border-color .2s, color .2s; padding: 16px; text-align: center; }
.newcard:hover { border-color: var(--ink); color: var(--ink); }
.newcard .plus { width: 52px; height: 52px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; }
.newcard .plus svg { width: 22px; height: 22px; }
.newcard b { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--ink); }

.seasons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding-bottom: 96px; }
.season { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border: 0; border-radius: 18px; overflow: hidden; text-align: left; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; color: #fff; background: var(--kc); isolation: isolate; transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.season::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(90% 70% at 80% 10%, rgb(255 255 255 / .45), transparent 60%), radial-gradient(80% 60% at 10% 100%, rgb(0 0 0 / .35), transparent 70%); }
.season:hover { transform: translateY(-4px); }
.season b { font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1; }
.season small { font-size: 13px; opacity: .85; }

/* ---------- Board ---------- */
.board { position: relative; isolation: isolate; }
.aura { position: absolute; inset: -120px 0 auto; height: 760px; z-index: -1; overflow: hidden; pointer-events: none; opacity: var(--aura); -webkit-mask-image: linear-gradient(#000 35%, transparent 95%); mask-image: linear-gradient(#000 35%, transparent 95%); }
.aura i { position: absolute; width: 60vw; max-width: 720px; aspect-ratio: 1; border-radius: 50%; filter: blur(90px); }
.aura i:nth-child(1) { background: var(--c1); left: -10%; top: 0; }
.aura i:nth-child(2) { background: var(--c2); left: 35%; top: -18%; }
.aura i:nth-child(3) { background: var(--c3); right: -12%; top: 10%; }
.bhead { padding-block: 22px 28px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: none; width: fit-content; margin-left: -4px; }
.back:hover { color: var(--ink); }
.back svg { width: 16px; height: 16px; }
.bhead .eyebrow button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
.titlein { font-family: var(--font-display); font-weight: 400; font-size: clamp(52px, 10vw, 128px); line-height: .95; letter-spacing: -.03em; border: 0; background: transparent; padding: 0; margin: 0; width: 100%; min-width: 0; resize: none; overflow: hidden; display: block; field-sizing: content; }
.titlein:focus { outline: none; }
.titlein::placeholder { color: var(--faint); }
.notein { width: 100%; max-width: 60ch; border: 0; background: transparent; resize: none; padding: 0; font-size: 17px; line-height: 1.6; color: var(--muted); field-sizing: content; min-height: 1.6em; }
.notein:focus { outline: none; color: var(--ink); }
.notein::placeholder { color: var(--faint); }

.palette { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; padding: 0; background: none; display: grid; gap: 6px; justify-items: start; }
.chip i { width: 54px; height: 72px; border-radius: 10px; display: block; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06); transition: transform .2s cubic-bezier(.2,.7,.2,1); }
.chip:hover i { transform: translateY(-3px); }
.chip span { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: .04em; }

.reflect { display: grid; gap: 14px; max-width: 760px; padding-block: 8px 12px; }
.reflect .eyebrow svg { width: 13px; height: 13px; }
.reflect p { margin: 0; font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3; letter-spacing: -.005em; text-wrap: pretty; }
.reflect .words { display: flex; flex-wrap: wrap; gap: 6px; }
.reflect .words span { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
.reflect .sugg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.reflect .sugg b { font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 20px; color: var(--ink); }

.bbody { padding-bottom: calc(130px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 28px; }
.drop { border-radius: 20px; padding: clamp(40px, 8vw, 90px) 24px; text-align: center; display: grid; gap: 14px; justify-items: center; background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px dashed var(--faint); }
.drop b { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 4vw, 44px); line-height: 1; }
.drop span { color: var(--muted); max-width: 40ch; }
body.dragging .drop, body.dragging .wall { outline: 2px dashed var(--ink); outline-offset: 8px; border-radius: 12px; }

.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); grid-auto-rows: 4px; column-gap: 10px; grid-auto-flow: dense; }
.wall.grid { grid-auto-rows: auto; row-gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tile { position: relative; margin: 0 0 10px; min-width: 0; align-self: start; }
.wall.grid .tile { margin: 0; }
.tile.feat { grid-column: span 2; }
.tile .ph { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--line); cursor: zoom-in; }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.2,.7,.2,1); }
.wall:not(.grid) .tile img { height: auto; }
.tile .ph:hover img { transform: scale(1.03); }
.wall.grid .tile .ph { aspect-ratio: 1; }
.tile figcaption { font-size: 13px; color: var(--muted); padding: 8px 2px 2px; overflow-wrap: anywhere; }
.tile .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; }
.tile:hover .acts, .tile:focus-within .acts { opacity: 1; transform: none; }
@media (hover: none) { .tile .acts { opacity: 1; transform: none; } }
.tile .acts button { width: 30px; height: 30px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgb(255 255 255 / .85); color: #121212; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
.tile .acts button:hover { background: #fff; }
.tile .acts button.on { background: #121212; color: #fff; }
.tile .acts svg { width: 15px; height: 15px; }
.tile .badge { position: absolute; left: 8px; top: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: rgb(255 255 255 / .85); color: #121212; pointer-events: none; }
.tile .capin { width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.tile .confirm { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; border-radius: 10px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 14px; padding: 12px; }
.tile .confirm div { display: flex; gap: 6px; justify-content: center; }
.tile .confirm .btn { height: 34px; padding: 0 14px; }
.tile.pending .ph { aspect-ratio: 4 / 5; cursor: default; }
.tile.pending .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--surface) 70%, transparent) 50%, transparent 70%); animation: shimmer 1.3s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- Dock ---------- */
.dock { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); box-shadow: var(--shadow); max-width: calc(100vw - 24px); }
.dock .btn { height: 44px; border: 0; background: transparent; padding: 0 16px; }
.dock .btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.dock .btn.dark { background: var(--ink); color: var(--bg); }
.dock .btn.round { width: 44px; padding: 0; }
.dock .btn.on { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.dock .spin svg { animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / .4); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.sheet { background: var(--surface); color: var(--ink); border-radius: 24px; width: min(500px, 100%); max-height: 100%; overflow: auto; padding: 28px; display: grid; gap: 22px; box-shadow: 0 40px 100px -30px rgb(0 0 0 / .55); animation: rise .28s cubic-bezier(.2,.7,.2,1); }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: -.02em; margin: 0; }
.field { display: grid; gap: 8px; }
.field > span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; height: 48px; padding: 0 14px; font-size: 16px; width: 100%; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--ink); }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.kind { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; }
.kind[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sheet .foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.sheet .danger { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }

/* ---------- Stage (contemplate): every photo on one screen ---------- */
.stage { position: fixed; inset: 0; z-index: 40; background: var(--stage); color: var(--stage-ink); overflow: hidden; animation: fade .6s ease; }
.stage .glow { position: absolute; inset: -20%; filter: blur(110px); opacity: .28; pointer-events: none; animation: breathe 14s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.12) rotate(8deg); } }
.stage .scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.stage .scroller::-webkit-scrollbar { display: none; }
.stage .canvas { position: relative; margin: 0 auto; }
.stage .ptile { position: absolute; border: 0; padding: 0; border-radius: 6px; overflow: hidden; background: rgb(255 255 255 / .04); cursor: zoom-in; opacity: 0; animation: appear 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes appear { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.stage .ptile img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kb var(--dur, 24s) ease-in-out infinite alternate; animation-delay: var(--delay, 0s); transform-origin: var(--ox, 50%) var(--oy, 50%); }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.14); } }
.stage .ptile:hover img { filter: brightness(1.08); }
.stage .chrome { position: absolute; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 14px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); transition: opacity .8s ease; pointer-events: none; }
.stage .chrome > * { pointer-events: auto; }
.stage .chrome.top { top: 0; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 40px; background: linear-gradient(rgb(0 0 0 / .65), transparent); }
.stage .chrome.bot { bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-top: 50px; background: linear-gradient(transparent, rgb(0 0 0 / .7)); align-items: flex-end; }
.stage.idle .chrome { opacity: 0; }
.stage.idle { cursor: none; }
.stage .sname { font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px); line-height: 1; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
.stage .sname small { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--stage-muted); margin-bottom: 8px; }
.stage .ib { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .08); color: var(--stage-ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex: none; }
.stage .ib:hover { background: rgb(255 255 255 / .18); }
.stage .ib svg { width: 18px; height: 18px; }
.stage .words { flex: 1 1 auto; min-width: 0; max-width: 62ch; margin-right: auto; font-family: var(--font-display); font-style: italic; font-size: clamp(17px, 1.7vw, 21px); line-height: 1.4; color: color-mix(in srgb, var(--stage-ink) 85%, var(--stage)); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.stage .dots { display: flex; gap: 5px; flex: none; }
.stage .dots i { width: 12px; height: 12px; border-radius: 50%; }
.stage .focus { position: absolute; inset: 0; z-index: 4; display: grid; grid-template-rows: 1fr auto; gap: 14px; padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); background: rgb(7 7 7 / .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: fade .35s ease; cursor: zoom-out; }

  back: '<path d="M15 18l-6-6 6-6"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',

/* ---------- Tiny DOM helper (all data goes in as text) ---------- */

}
function setBanner(msg) { $('#banner').textContent = msg || ''; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const safeHex = (c) => (typeof c === 'string' && HEX.test(c) ? c : '#888888');
const str = (v, max = 4000) => (typeof v === 'string' ? v.slice(0, max) : '');
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

/* ---------- State ---------- */
let boards = {};
let store = null;
let assets = null;
let sample = null;
let loaded = false;
let filter = 'all';
let editingCaption = null;
let confirmDelete = null;
let reflecting = false;
const pendingUploads = {};

function normalize(b) {
  b = (b && typeof b === 'object') ? b : {};
  return {
    name: str(b.name, 200),
    kind: KINDS[b.kind] ? b.kind : 'other',
    year: Number.isInteger(b.year) ? b.year : null,
    date: typeof b.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(b.date) ? b.date : '',
    note: str(b.note, 4000),
    layout: b.layout === 'grid' ? 'grid' : 'collage',
    cover: typeof b.cover === 'string' ? b.cover : null,
    photos: Array.isArray(b.photos) ? b.photos.filter((p) => p && typeof p.id === 'string').map((p) => ({
      id: p.id, w: +p.w || 4, h: +p.h || 3, caption: str(p.caption, 500),
      colors: Array.isArray(p.colors) ? p.colors.filter((c) => HEX.test(c)).slice(0, 6) : [],
      feat: !!p.feat,
    })) : [],

      words: Array.isArray(b.reflection.words) ? b.reflection.words.map((w) => str(w, 40)).filter(Boolean).slice(0, 6) : [],

    created: +b.created || Date.now(),
    updated: +b.updated || Date.now(),

}

/* ---------- Colours ---------- */
const hexOf = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
const rgbOf = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const dist = (a, b) => Math.hypot(a[0] - b[0], (a[1] - b[1]) * 1.2, a[2] - b[2]);
function lum([r, g, b]) { return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function sat([r, g, b]) { const mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx === 0 ? 0 : (mx - mn) / mx; }

function extractColors(ctx, w, hgt) {
  const data = ctx.getImageData(0, 0, w, hgt).data;
  const buckets = new Map();
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 200) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const key = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
    let e = buckets.get(key);
    if (!e) buckets.set(key, e = [0, 0, 0, 0]);
    e[0] += r; e[1] += g; e[2] += b; e[3]++;
  }
  const list = [...buckets.values()].map((e) => {
    const c = [e[0] / e[3], e[1] / e[3], e[2] / e[3]];
    return { c, score: e[3] * (0.6 + sat(c)) };
  }).sort((a, b) => b.score - a.score);
  const picked = [];
  for (const e of list) {
    if (picked.every((p) => dist(p, e.c) > 46)) picked.push(e.c);
    if (picked.length === 5) break;
  }
  return picked.map((c) => hexOf(...c));
}
function boardPalette(photos) {
  const pool = [];
  for (const p of photos) p.colors.forEach((hex, i) => {
    const c = rgbOf(hex), w = 5 - i + (p.feat ? 2 : 0);
    const near = pool.find((q) => dist(q.c, c) < 40);
    if (near) { const t = near.w + w; near.c = near.c.map((v, k) => (v * near.w + c[k] * w) / t); near.w = t; }
    else pool.push({ c, w });
  });
  return pool.sort((a, b) => b.w - a.w).slice(0, 6).sort((a, b) => lum(b.c) - lum(a.c)).map((e) => hexOf(...e.c));
}
function tints(b) {
  const p = b.palette.length ? b.palette : [KINDS[b.kind].color];
  const vivid = [...p].sort((a, c) => sat(rgbOf(c)) - sat(rgbOf(a)));
  return { '--c1': safeHex(vivid[0]), '--c2': safeHex(vivid[1] || vivid[0]), '--c3': safeHex(vivid[2] || vivid[0]), '--kc': KINDS[b.kind].color };
}

/* ---------- Images ---------- */
async function decode(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (_) {
    const url = URL.createObjectURL(file);
    try { const img = new Image(); img.src = url; await img.decode(); return img; }
    finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  }
}
function canvasBlob(canvas, type, q) { return new Promise((res) => canvas.toBlob(res, type, q)); }
async function prepare(file) {
  const src = await decode(file);
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  if (!w0 || !h0) throw new Error('empty');
  const s = Math.min(1, MAX_SIDE / Math.max(w0, h0));
  const w = Math.round(w0 * s), hh = Math.round(h0 * s);
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  c.getContext('2d').drawImage(src, 0, 0, w, hh);
  const blob = await canvasBlob(c, 'image/jpeg', 0.86);
  const sw = 72, sh = Math.max(1, Math.round(72 * hh / w));
  const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
  const sctx = sc.getContext('2d', { willReadFrequently: true }); sctx.drawImage(c, 0, 0, sw, sh);
  if (src.close) src.close();
  return { blob, w, h: hh, colors: extractColors(sctx, sw, sh) };
}

/* ---------- Backends ---------- */
function makeWriter(writeFn, onError) {
  const pending = new Map(), running = new Set();
  async function flush(id) {
    if (running.has(id)) return;
    running.add(id);
    try {
      while (pending.has(id)) {
        const body = pending.get(id); pending.delete(id);
        try { await writeFn(id, body); }
        catch (e) {
          if (e && (e.code === 'unavailable' || e.code === 'store_unavailable')) {
            await new Promise((r) => setTimeout(r, 700 + Math.random() * 800));
            try { await writeFn(id, body); } catch (e2) { onError(e2); }
          } else onError(e);
        }
      }
    } finally { running.delete(id); }
  }
  return { queue(id, body) { pending.set(id, body); flush(id); }, busy: (id) => running.has(id) || pending.has(id) };
}

async function cloudBackend(db, userId) {
  const col = db.collection('data/users/' + userId);
  const writer = makeWriter((id, body) => body === null ? col.doc(id).delete() : col.doc(id).set(body), (e) => {
    toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete a board you no longer need, then try again.' : 'That change didn’t save. Check your connection and try again.');
  });
  let first = true;
  await new Promise((resolve) => {
    const timer = setTimeout(() => { setBanner('Your boards can’t be reached yet. What you see may be out of date.'); resolve(); }, 10000);
    col.onSnapshot((snap) => {
      const seen = new Set();
      for (const doc of snap.docs) {
        if (!doc.id.startsWith('board-')) continue;
        const id = doc.id.slice(6); seen.add(id);
        if (writer.busy(doc.id)) continue;
        boards[id] = normalize(doc.data());
      }
      for (const id of Object.keys(boards)) if (!seen.has(id) && !writer.busy('board-' + id)) delete boards[id];
      if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); setBanner(''); }
      if (first) { first = false; resolve(); } else if (!isEditing()) render();
    }, (e) => {
      clearTimeout(timer);
      setBanner(e && e.code === 'revoked' ? '' : 'Live sync stopped. Reload the page to reconnect.');
      resolve();
    });
  });
  return {
    kind: 'cloud',
    save: (id, b) => writer.queue('board-' + id, b),
    remove: (id) => writer.queue('board-' + id, null),
    url: (assetId) => (ASSET.test(assetId) ? '/_blob/' + assetId : ''),
    async upload(blob) { const r = await assets.upload(blob, { type: 'image/jpeg' }); return r.id; },
    async drop(assetId) { if (assets && ASSET.test(assetId)) await assets.delete(assetId).catch(() => {}); },
    async blob(assetId) { const r = await fetch('/_blob/' + assetId); if (!r.ok) throw new Error('fetch'); return r.blob(); },
  };
}

function localBackend() {
  const KEY = 'mood-almanac.boards';
  try { const raw = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const id in raw) boards[id] = normalize(raw[id]); } catch (_) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(boards)); } catch (_) { toast('This browser won’t store more boards here.'); } };
  let dbp = null;
  const idb = () => dbp ||= new Promise((res, rej) => {
    try {
      const r = indexedDB.open('mood-almanac', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('images');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  const tx = async (mode, fn) => { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('images', mode); const q = fn(t.objectStore('images')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const urls = new Map();
  return {
    kind: 'local',
    save: () => persist(),
    remove: () => persist(),
    url(id) {
      if (urls.has(id)) return urls.get(id);
      const p = tx('readonly', (s) => s.get(id)).then((b) => { const u = b ? URL.createObjectURL(b) : ''; urls.set(id, u); return u; }).catch(() => '');
      urls.set(id, p); return p;
    },
    async upload(blob) { const id = 'l' + uid(); await tx('readwrite', (s) => s.put(blob, id)); return id; },
    async drop(id) { await tx('readwrite', (s) => s.delete(id)).catch(() => {}); },
    async blob(id) { const b = await tx('readonly', (s) => s.get(id)); if (!b) throw new Error('missing'); return b; },
  };
}
function setImg(img, id) {
  const u = store.url(id);
  if (typeof u === 'string') img.src = u;
  else u.then((x) => { if (x) img.src = x; });
}
function photoImg(p, props) { const img = h('img', Object.assign({ alt: p.caption || '', loading: 'lazy', decoding: 'async' }, props || {})); setImg(img, p.id); return img; }

/* ---------- Board operations ---------- */
const saveTimers = {};
function save(id, { soon = false } = {}) {
  const b = boards[id]; if (!b) return;
  b.updated = Date.now();
  clearTimeout(saveTimers[id]);
  const go = () => store.save(id, structuredClone(b));
  if (soon) saveTimers[id] = setTimeout(go, 700); else go();
}
function label(b) {
  const k = KINDS[b.kind];
  if (b.kind === 'event' && b.date) {
    const d = new Date(b.date + 'T12:00:00');
    return k.label + ' · ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  return b.year ? k.label + ' ' + b.year : k.label;
}
function currentSeason(d = new Date()) {
  const m = d.getMonth();
  return m < 2 || m === 11 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'autumn';
}
function createBoard({ name, kind, year, date }) {
  const id = uid();
  boards[id] = normalize({ name, kind, year, date, created: Date.now(), updated: Date.now() });
  save(id);
  location.hash = 'board-' + id;
  return id;
}
function coverList(b, n = 4) {
  const ph = b.photos.slice();
  const ci = ph.findIndex((p) => p.id === b.cover);
  if (ci > 0) ph.unshift(ph.splice(ci, 1)[0]);
  return ph.slice(0, n);
}

async function addFiles(id, files) {
  files = [...files].filter((f) => f && (f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif|avif)$/i.test(f.name || '')));
  if (!files.length) return;
  if (store.kind === 'cloud' && !assets) { toast('Only people who can edit this app can add photos.'); return; }
  pendingUploads[id] = (pendingUploads[id] || 0) + files.length;
  render();
  let failed = 0;
  for (const f of files) {
    try {
      const prep = await prepare(f);
      const assetId = await store.upload(prep.blob);
      const b = boards[id];
      if (!b) { store.drop(assetId); continue; }
      b.photos.push({ id: assetId, w: prep.w, h: prep.h, caption: '', colors: prep.colors, feat: false });
      b.palette = boardPalette(b.photos);
      if (!b.cover) b.cover = assetId;
      save(id);
    } catch (e) {
      failed++;
      if (e && e.code === 'quota_or_state') toast('Photo storage is full. Remove some photos and try again.');
      else if (e && e.code === 'rate_limited') toast('Adding photos too quickly. Wait a moment and add the rest.');
    } finally {
      pendingUploads[id]--;
      if (!isEditing()) render();
    }
  }
  if (failed && failed === files.length) toast(failed === 1 ? 'That photo couldn’t be read. Try a JPEG or PNG.' : 'Those photos couldn’t be read. Try JPEG or PNG files.');

}
function removePhoto(id, pid) {
  const b = boards[id]; if (!b) return;
  b.photos = b.photos.filter((p) => p.id !== pid);
  if (b.cover === pid) b.cover = b.photos[0]?.id || null;
  b.palette = boardPalette(b.photos);
  save(id);
  store.drop(pid);
  confirmDelete = null;
  render();
}
function deleteBoard(id) {
  const b = boards[id]; if (!b) return;
  const ids = b.photos.map((p) => p.id);
  delete boards[id];
  store.remove(id);
  ids.forEach((pid) => store.drop(pid));
  location.hash = '';
  toast('Board deleted.');
}

/* ---------- Claude reflection ---------- */
async function reflect(id) {
  const b = boards[id]; if (!b || !sample || reflecting) return;
  reflecting = true; render();
  try {
    const lim = await sample.limits().catch(() => null);
    const max = lim && lim.images ? Math.min(lim.images.maxCount, 6) : 0;
    const chosen = [];
    if (max && b.photos.length) {
      const n = Math.min(max, b.photos.length), step = b.photos.length / n;
      for (let i = 0; i < n; i++) chosen.push(b.photos[Math.floor(i * step)]);
    }
    const images = (await Promise.all(chosen.map((p) => store.blob(p.id).catch(() => null)))).filter(Boolean);
    const caps = b.photos.map((p) => p.caption).filter(Boolean).slice(0, 20);
    const seasonal = KINDS[b.kind].season;
    const prompt = [
      'You are looking at a personal moodboard someone made to collect the feeling of a ' + (seasonal ? 'season' : 'moment') + '.',
      'Board name: ' + (b.name || '(untitled)'),
      'Type: ' + label(b),
      b.note ? 'What they wrote about it: ' + b.note : '',
      caps.length ? 'Their photo captions: ' + caps.join(' | ') : '',
      b.palette.length ? 'Colours drawn from the photos: ' + b.palette.join(', ') : '',
      images.length ? images.length + ' of the ' + b.photos.length + ' photos are attached.' : 'No photos are attached; work from the text and colours.',
      '',
      'Write a short contemplation of this board: 60 to 100 words, in calm, concrete language. Notice what the images share: light, texture, colour, places, objects, pace. Speak to the person gently in the second person, and end with one quiet question or intention they could carry through this ' + (seasonal ? 'season' : 'time') + '. No clichés, no exclamation marks, no lists.',
      'Also give 3 to 5 single mood words, and a suggested board title of 2 to 5 words.',
      'Reply with JSON only: {"reflection": string, "words": string[], "title": string}',
    ].filter(Boolean).join('\n');
    const out = await sample.json(prompt, images.length ? { images, modelTier: 'default' } : { modelTier: 'default' });
    if (!boards[id]) return;
    boards[id].reflection = {
      text: str(out && out.reflection, 2000),
      words: Array.isArray(out && out.words) ? out.words.map((w) => str(w, 40)).filter(Boolean).slice(0, 6) : [],
      title: str(out && out.title, 120), at: Date.now(),
    };
    save(id);
  } catch (e) {
    const code = e && e.code;
    toast(code === 'not_granted' ? 'Claude wasn’t allowed for this page. You can allow it from the artifact’s Permissions menu.'
      : code === 'rate_limited' ? 'Claude is busy right now. Try again in a minute.'
      : 'Claude couldn’t write a reflection this time. Try again.');
  } finally { reflecting = false; render(); }
}

function layoutWall() {

    const grid = wall.classList.contains('grid');

    const gap = first ? parseFloat(getComputedStyle(first).marginBottom) || 0 : 0;
    wall.querySelectorAll('.tile').forEach((t) => { t.style.gridRowEnd = grid ? '' : 'span ' + Math.ceil((t.getBoundingClientRect().height + gap) / 4); });

  fit();

/* ---------- Contemplate stage: the whole board on one screen ---------- */
/* Justified rows sized so every photo fits the screen; scrolls only when the board is very large. */
function justify(ars, W, H, gap) {
  const N = ars.length, totalAR = ars.reduce((n, a) => n + a, 0);
  // Split photos (in order) into k rows of roughly equal width, each row scaled to the full width.
  const build = (k) => {
    const target = totalAR / k, rows = []; let row = [], sum = 0, cum = 0;
    ars.forEach((ar, i) => {
      row.push(i); sum += ar; cum += ar;
      const left = N - i - 1, rowsLeft = k - rows.length - 1;
      if (rowsLeft > 0 && left >= rowsLeft && (cum >= target * (rows.length + 1) - ar / 2 || left === rowsLeft)) { rows.push({ items: row, sum }); row = []; sum = 0; }
    });
    if (row.length) rows.push({ items: row, sum });
    rows.forEach((r) => { r.h = Math.min((W - gap * (r.items.length - 1)) / r.sum, H); });
    return { rows, total: rows.reduce((n, r) => n + r.h, 0) + gap * (rows.length - 1) };
  };
  let best = build(1);
  for (let k = 2; k <= N; k++) { const l = build(k); if (l.total <= H) best = l; else break; }
  const minT = W < 600 ? 110 : 150;
  if (N > 1 && Math.min(...best.rows.map((r) => r.h)) < minT) best = build(Math.min(N, Math.max(1, Math.ceil(totalAR * minT / W))));
  const out = []; let y = 0;
  for (const r of best.rows) {
    const rowW = r.sum * r.h + gap * (r.items.length - 1);
    let x = (W - rowW) / 2;
    for (const i of r.items) { const w = ars[i] * r.h; out[i] = { x, y, w, h: r.h }; x += w + gap; }
    y += r.h + gap;
  }
  return { boxes: out, height: Math.max(0, y - gap) };
}

let stage = null;
function openStage(id, focusAt) {

  const glow = h('div', { class: 'glow', style: { background: 'radial-gradient(circle at 20% 25%, ' + safeHex(pal[0]) + ', transparent 50%), radial-gradient(circle at 80% 30%, ' + safeHex(pal[Math.floor(pal.length / 2)]) + ', transparent 50%), radial-gradient(circle at 50% 90%, ' + safeHex(pal[pal.length - 1]) + ', transparent 55%)' } });
  const canvas = h('div', { class: 'canvas' });
  const scroller = h('div', { class: 'scroller' }, canvas);
  const tiles = photos.map((p, i) => {
    const img = photoImg(p, { alt: p.caption || 'Photo ' + (i + 1), loading: 'eager' });
    const r = (n) => (Math.sin((i + 1) * 9301 + n * 49297) * 0.5 + 0.5);

    img.style.setProperty('--delay', (-r(2) * 20).toFixed(1) + 's');
    img.style.setProperty('--ox', Math.round(r(3) * 100) + '%');
    img.style.setProperty('--oy', Math.round(r(4) * 100) + '%');
    const t = h('button', { class: 'ptile', type: 'button', 'aria-label': 'Enlarge ' + (p.caption || 'photo ' + (i + 1)), style: { 'animation-delay': (i * 70) + 'ms' }, onclick: () => focus(i) }, img);
    canvas.append(t);
    return t;
  });
  const btn = (name, lab, fn, cls) => h('button', { class: 'ib' + (cls ? ' ' + cls : ''), type: 'button', 'aria-label': lab, title: lab, onclick: (e) => { e.stopPropagation(); fn(); } }, icon(name));
  const text = b.reflection && b.reflection.text ? b.reflection.text : b.note;
  const top = h('div', { class: 'chrome top' },
    h('div', { class: 'sname' }, h('small', {}, label(b) + ' · ' + plural(photos.length, 'photo', 'photos')), b.name || 'Untitled'),
    document.fullscreenEnabled ? btn('full', 'Full screen', () => { (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen()).catch(() => {}); }) : null,
    btn('close', 'Close (Esc)', closeStage));
  const bot = h('div', { class: 'chrome bot' },
    text ? h('div', { class: 'words' }, text) : h('div', { class: 'words' }),
    h('div', { class: 'dots', 'aria-hidden': 'true' }, pal.map((c) => h('i', { style: { background: safeHex(c) } }))));
  const el = h('div', { class: 'stage', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Contemplate ' + (b.name || 'board') }, glow, scroller, top, bot);

  function layout() {
    const narrow = window.innerWidth < 600;
    const padX = narrow ? 10 : Math.max(28, window.innerWidth * 0.04);
    const padTop = narrow ? 86 : 100, padBot = narrow ? 70 : 90;
    const W = window.innerWidth - padX * 2, H = window.innerHeight - padTop - padBot;
    const gap = narrow ? 4 : 8;
    const { boxes, height } = justify(photos.map((p) => p.w / p.h), W, H, gap);
    canvas.style.width = W + 'px';
    canvas.style.height = height + 'px';
    canvas.style.marginTop = (height < H ? padTop + (H - height) / 2 : padTop) + 'px';
    canvas.style.marginBottom = padBot + 'px';
    boxes.forEach((bx, i) => Object.assign(tiles[i].style, { left: bx.x + 'px', top: bx.y + 'px', width: bx.w + 'px', height: bx.h + 'px' }));
  }

  let focused = null, focusEl = null;
  function focus(i) {
    unfocus();
    focused = (i + photos.length) % photos.length;
    const p = photos[focused];
    focusEl = h('div', { class: 'focus', onclick: unfocus },
      photoImg(p, { alt: p.caption || '' }),
      h('p', {}, p.caption || ''),
      photos.length > 1 ? btn('left', 'Previous (←)', () => focus(focused - 1), 'l') : null,
      photos.length > 1 ? btn('right', 'Next (→)', () => focus(focused + 1), 'r') : null,
      btn('close', 'Back to the board', unfocus, 'x'));
    el.append(focusEl);
  }
  function unfocus() { focusEl?.remove(); focusEl = null; focused = null; }

  let idleTimer = null;
  const wake = () => { el.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => el.classList.add('idle'), 3500); };
  el.addEventListener('pointermove', wake);
  el.addEventListener('pointerdown', wake);
  const onKey = (e) => {
    wake();
    if (e.key === 'Escape') { focusEl ? unfocus() : closeStage(); }
    else if (focusEl && e.key === 'ArrowRight') focus(focused + 1);
    else if (focusEl && e.key === 'ArrowLeft') focus(focused - 1);
  };
  const onResize = () => requestAnimationFrame(layout);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  let lock = null;
  navigator.wakeLock?.request('screen').then((w) => { lock = w; }, () => {});
  stage = { el, stop: () => { clearTimeout(idleTimer); document.removeEventListener('keydown', onKey); window.removeEventListener('resize', onResize); lock?.release().catch(() => {}); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } };
  document.body.append(el);
  document.documentElement.style.overflow = 'hidden';
  layout();
  wake();
  if (Number.isInteger(focusAt) && focusAt >= 0) focus(focusAt);
  el.querySelector('.chrome.top .ib:last-child').focus({ preventScroll: true });
}
function closeStage() {
  if (!stage) return;
  stage.stop(); stage.el.remove(); stage = null;
  document.documentElement.style.overflow = '';
}

/* ---------- Boot ---------- */
$('#newTop').addEventListener('click', () => openSheet({}));
window.addEventListener('hashchange', () => { closeStage(); confirmDelete = null; editingCaption = null; render(); window.scrollTo(0, 0); });

(async function boot() {
  try { const f = sessionStorage.getItem('mood-almanac.filter'); if (f) filter = f; } catch (_) {}
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, smp, ast] = await Promise.all([use('db'), use('user'), use('sample'), use('assets')]);
  sample = smp; assets = ast;
  const userId = user ? await user.id().catch(() => null) : null;
  if (db && userId) {
    try { store = await cloudBackend(db, userId); }
    catch (_) { store = localBackend(); }
  } else {
    store = localBackend();
    if (window.claude) setBanner('Sign in to Claude to keep your boards across devices. For now they’re saved in this browser only.');
  }
  loaded = true;
  render();
})();
</script>
