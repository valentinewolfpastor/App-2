<title>Daily Rhythm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen app shell. A time-of-day sky band heads each tab, cards float on a cool ground,
   only the middle scrolls, and a floating tab bar stays pinned at the bottom. */
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --sunken: #eaedf4;
  --ink: #151a2d;
  --muted: #5e6680;
  --line: #e2e6ef;
  --accent: #178a6c;
  --accent-ink: #ffffff;
  --accent-soft: #daf2ea;
  --kcal: #cf5536;
  --kcal-soft: #fce6df;
  --flame: #e2632a;
  --danger: #c4321f;
  --h1: #178a6c; --h2: #e0703f; --h3: #d6a21e; --h4: #7a5af0; --h5: #2f8fd8; --h6: #d9497a;
  --mood-1: #cf5536; --mood-2: #e0904a; --mood-3: #b9a85c; --mood-4: #4fa883; --mood-5: #178a6c;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius: 20px;
  --shadow: 0 1px 2px rgba(21, 26, 45, .04), 0 6px 20px rgba(21, 26, 45, .06);
  --card-border: transparent;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1020; --surface: #171b2e; --sunken: #20253d; --ink: #eef0f8; --muted: #9ba2bd; --line: #282e4b;
    --accent: #4fd1a9; --accent-ink: #052419; --accent-soft: #163a32; --kcal: #ff9576; --kcal-soft: #3a221f;
    --flame: #ff8b4f; --danger: #ff7a66;
    --h1: #4fd1a9; --h2: #ff9a6a; --h3: #f2c64b; --h4: #a48cff; --h5: #62b4ff; --h6: #ff7aa6;
    --mood-1: #ff9576; --mood-2: #f4ae6a; --mood-3: #d4c47e; --mood-4: #6fd0a7; --mood-5: #4fd1a9;
    --shadow: none; --card-border: #252b47; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1020; --surface: #171b2e; --sunken: #20253d; --ink: #eef0f8; --muted: #9ba2bd; --line: #282e4b;
  --accent: #4fd1a9; --accent-ink: #052419; --accent-soft: #163a32; --kcal: #ff9576; --kcal-soft: #3a221f;
  --flame: #ff8b4f; --danger: #ff7a66;
  --h1: #4fd1a9; --h2: #ff9a6a; --h3: #f2c64b; --h4: #a48cff; --h5: #62b4ff; --h6: #ff7aa6;
  --mood-1: #ff9576; --mood-2: #f4ae6a; --mood-3: #d4c47e; --mood-4: #6fd0a7; --mood-5: #4fd1a9;
  --shadow: none; --card-border: #252b47; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap {
  max-width: 600px; margin: -26px auto 0; position: relative; z-index: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 28px;
  display: grid; gap: 14px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; letter-spacing: -.02em; line-height: 1.05; }
h2 { font-size: 19px; letter-spacing: -.01em; }
.label { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.section { display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 4px 0; }

.card { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.banner { font-size: 13px; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }

/* ---------- Sky hero ---------- */
.hero { position: relative; overflow: hidden; color: #fff; padding-block: 18px 46px; }
.hero.dawn  { background: linear-gradient(160deg, #a2412f 0%, #c8622a 55%, #d98a35 100%); }
.hero.day   { background: linear-gradient(160deg, #135e6b 0%, #1d7f8c 55%, #2b97a0 100%); }
.hero.dusk  { background: linear-gradient(160deg, #6e2f58 0%, #8a3b62 50%, #b4565e 100%); }
.hero.night { background: linear-gradient(160deg, #10183d 0%, #1f2457 55%, #34296a 100%); }
.hero-in { max-width: 568px; margin: 0 auto; position: relative; z-index: 1; display: grid; gap: 16px; }
.hero .arc { position: absolute; right: -30px; top: 6px; width: 230px; height: 115px; opacity: .55; pointer-events: none; }
.hero .arc path { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1.5; stroke-dasharray: 2 5; }
.hero .arc circle { fill: #fff; }
.hero .arc .glow { fill: rgba(255,255,255,.22); }
.hero-top { display: flex; align-items: flex-start; gap: 10px; }
.hero-top .t { flex: 1; min-width: 0; }
.hero .label { color: rgba(255,255,255,.78); }
.hero .sub { margin: 4px 0 0; color: rgba(255,255,255,.85); font-weight: 600; }
.hero .linkbtn { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; font-size: 19px; flex: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.round:disabled { opacity: .35; cursor: default; }
.card .round { border-color: var(--line); background: var(--surface); color: var(--ink); backdrop-filter: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; }

.hero-stats { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.hero-ring { position: relative; width: 84px; height: 84px; }
.hero-ring .ring { width: 84px; height: 84px; }
.hero-ring .ring .track { stroke: rgba(255,255,255,.22); }
.hero-ring .ring .bar { stroke: #fff; }
.hero-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; line-height: 1; text-align: center; }
.hero-ring b small { display: block; font: 700 10px/1.2 var(--font-body); opacity: .8; letter-spacing: .04em; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.tile .k { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; opacity: .78; display: block; }
.tile .v { font-family: var(--font-display); font-size: 18px; line-height: 1.25; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v.word { font-family: var(--font-body); font-size: 14px; font-weight: 800; line-height: 1.6; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hchip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
.big-kcal { font-family: var(--font-display); font-size: 52px; line-height: 1; letter-spacing: -.02em; }
.big-kcal span { font-size: 18px; opacity: .8; letter-spacing: 0; }

.ring { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .bar { stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.chip.kcal { background: var(--kcal-soft); color: var(--kcal); }
.chip.good { background: var(--accent-soft); color: var(--accent); }

/* ---------- Habits ---------- */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.habit { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--card-border); border-radius: 18px; padding: 11px 14px 11px 11px; box-shadow: var(--shadow); transition: background .2s, transform .1s; }
.habit:active { transform: scale(.985); }
.habit .emo { --hue: var(--h1); width: 42px; height: 42px; border-radius: 13px; background: color-mix(in srgb, var(--hue) 15%, var(--surface)); display: grid; place-items: center; font-size: 20px; flex: none; }
.habit .body { flex: 1; min-width: 0; }
.habit .name { display: block; font-weight: 700; overflow-wrap: anywhere; }
.habit .meta { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.habit .meta .flame { color: var(--flame); font-weight: 800; }
.tick { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: transparent; font-weight: 800; font-size: 15px; transition: all .2s; }
.habit[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.habit[aria-checked="true"] .name { color: var(--accent); }
.habit[aria-checked="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: scale(1.05); }
.habit.met .tick { border-color: var(--accent); color: var(--accent); }
.habit.off { opacity: .55; box-shadow: none; }

.extras { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; border: 1.5px dashed var(--line); background: var(--surface); font-weight: 700; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent); }
.pill .c { font-size: 11px; font-weight: 800; opacity: .75; }

.travel { display: grid; gap: 10px; }
.travel-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.travel-top .grow { flex: 1 1 160px; min-width: 0; }
.travel.on { background: color-mix(in srgb, var(--h5) 12%, var(--surface)); }
.travel.on .pill[aria-pressed="true"] { background: var(--h5); border-color: var(--h5); color: #fff; }
.goal { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.goal:first-child { border-top: 0; }
.goal .gtick { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); background: transparent; flex: none; display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 800; padding: 0; margin-top: 1px; }
.goal .gtick[aria-checked="true"] { background: var(--h4); border-color: var(--h4); color: #fff; }
.goal .gtext { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.goal.done .gtext { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.goal .gdel { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 2px 4px; }
.goal-bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--h4); border-radius: 3px; transition: width .4s; }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
input[type=text], input[type=number], input[type=search], select, textarea {
  width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; min-width: 0;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.btn { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 28%, transparent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.weight-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.weight-row input { width: 130px; flex: none; font-family: var(--font-display); font-size: 20px; }
.delta { font-size: 13px; font-weight: 800; }

/* ---------- Food ---------- */
.meal { display: grid; gap: 4px; }
.meal-head { display: flex; align-items: center; gap: 10px; }
.meal-head .dot { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; background: var(--kcal-soft); flex: none; }
.meal-head h2 { flex: 1; }
.food { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line); }
.food:first-of-type { border-top: 0; }
.food .what { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.food .items { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.food .kc { text-align: right; font-weight: 800; color: var(--kcal); font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--font-display); font-size: 17px; }
.food .kc small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; font-family: var(--font-body); }
.food .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.thinking { color: var(--muted); font-style: italic; font-family: var(--font-body); font-size: 13px; font-weight: 600; }
.photo-name { font-size: 12px; color: var(--muted); }

/* ---------- Check-in ---------- */
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 2px 8px; display: grid; gap: 3px; justify-items: center; font-size: 24px; transition: transform .15s, background .15s; }
.scale button span { font-size: 11px; font-weight: 700; color: var(--muted); }
.scale button[aria-pressed="true"] { border-color: var(--sel); background: color-mix(in srgb, var(--sel) 16%, var(--surface)); transform: translateY(-2px); }
.scale button[aria-pressed="true"] span { color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
.tag[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.saved { font-size: 12px; color: var(--muted); min-height: 1em; }

/* ---------- Insights ---------- */
.ai-card { background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--h4), var(--h5), var(--h1)) border-box; border: 1.5px solid transparent; }
.finding { display: grid; grid-template-columns: 10px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.finding:first-child { border-top: 0; padding-top: 2px; }
.finding .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.finding.positive .dot { background: var(--accent); }
.finding.negative .dot { background: var(--kcal); }
.finding h3 { font-family: var(--font-body); font-size: 15px; font-weight: 800; }
.finding p { margin: 2px 0 0; color: var(--muted); }
.conf { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ai-out ul { margin: 6px 0 0; padding-left: 18px; }
.ai-out li { margin: 3px 0; }
.compare { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.compare th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 800; padding: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.compare th:not(:first-child), .compare td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
.compare td { padding: 8px 0; border-top: 1px solid var(--line); }
.compare .up { color: var(--accent); font-weight: 800; }
.compare .down { color: var(--kcal); font-weight: 800; }
.scroll-x { overflow-x: auto; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -125%); }

.grid7 { width: 100%; border-collapse: collapse; table-layout: fixed; }
.grid7 th { font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 6px; }
.grid7 th.today { color: var(--accent); }
.grid7 th:first-child { width: 32px; }
.grid7 th .tv { display: block; font-size: 10px; }
.grid7 td { text-align: center; padding: 2px 0; }
.grid7 td:first-child { text-align: left; font-size: 17px; }
.cell { width: 28px; height: 28px; max-width: 100%; border-radius: 9px; border: 1.5px solid var(--line); background: transparent; padding: 0; font-size: 13px; font-weight: 800; color: var(--accent-ink); }
.cell.done { background: var(--accent); border-color: var(--accent); }
.cell.off { border-style: dashed; opacity: .45; }
.cell:disabled { opacity: .25; cursor: default; }

.stat { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.stat:first-child { border-top: 0; }
.stat .n { font-weight: 700; display: block; overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; margin-top: 5px; overflow: hidden; display: block; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.stat b { color: var(--flame); font-size: 19px; font-family: var(--font-display); display: block; text-align: right; }

/* ---------- Manage ---------- */
.mrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow .e { width: 26px; text-align: center; font-size: 20px; flex: none; }
.mrow .b { flex: 1; min-width: 0; }
.mrow .b strong { display: block; overflow-wrap: anywhere; }
.mini { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 14px; flex: none; }
.mini:disabled { opacity: .3; cursor: default; }
.mini.danger { color: var(--danger); }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* ---------- Tab bar (pinned: the page scrolls above it) ---------- */
.tabbar-wrap {
  flex: none; background: var(--bg);
  padding: 6px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
}
.tabbar {
  max-width: 520px; margin: 0 auto; display: flex;
  background: var(--surface); border: 1px solid var(--card-border); border-radius: 22px;
  box-shadow: 0 6px 24px rgba(21, 26, 45, .12); padding: 5px;
}
.tab { flex: 1; background: none; border: 0; display: grid; justify-items: center; gap: 1px; font-size: 10.5px; font-weight: 800; color: var(--muted); padding: 6px 0 5px; border-radius: 16px; transition: background .2s, color .2s; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* ---------- Sheet & toast ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 10, 20, .45); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: min(600px, 100%); border-radius: 24px 24px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; z-index: 30; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }

@media (min-width: 640px) { .hero { padding-block: 26px 52px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="scroller"><main id="app"><div class="wrap" style="margin-top:24px"><p class="muted">Loading your day…</p></div></main></div>

<div class="tabbar-wrap"><nav class="tabbar" aria-label="Sections">

  <button class="tab" type="button" data-view="feel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>Check-in</button>
  <button class="tab" type="button" data-view="insights"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>Insights</button>
  <button class="tab" type="button" data-view="manage"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Habits</button>
</nav></div>

<div id="sheet-root"></div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';

/* ================= Defaults ================= */

const DEFAULT_HABITS = [
  { id: 'workout',      icon: '🏋️', name: 'Work out',                    schedule: { type: 'daily' } },
  { id: 'run',          icon: '🏃', name: 'Go for a run',                 schedule: { type: 'weekly', times: 1 } },
  { id: 'supplements',  icon: '💊', name: 'Wellbel & supplements',        schedule: { type: 'daily' } },
  { id: 'electrolytes', icon: '💧', name: 'Drink electrolytes',           schedule: { type: 'daily' } },
  { id: 'water',        icon: '🚰', name: 'Drink 8 glasses of water',     schedule: { type: 'daily' } },
  { id: 'no-sugar',     icon: '🍬', name: 'No sugar',                     schedule: { type: 'weekdays' } },
  { id: 'no-alcohol',   icon: '🍷', name: 'No alcohol on weeknights',     schedule: { type: 'weekdays' } },
  { id: 'no-snacking',  icon: '🚫', name: 'No snacking',                  schedule: { type: 'daily' } },
  { id: 'news',         icon: '📰', name: 'Read the news / news podcast', schedule: { type: 'daily' } },
  { id: 'meditate',     icon: '🧘', name: 'Meditate 10 min',              schedule: { type: 'daily' } },
  { id: 'stretch',      icon: '🤸', name: 'Stretch 15 min',               schedule: { type: 'daily' } },
  { id: 'vibration',    icon: '📳', name: 'Vibration plate 10 min',       schedule: { type: 'daily' } },
  { id: 'steps',        icon: '👟', name: 'Walk 8,000+ steps',            schedule: { type: 'daily' } },
];

// Tracked when they happen; never counted as missed.
const DEFAULT_EXTRAS = [
  { id: 'stretchlab', icon: '🙆', name: 'Stretch Lab' },
  { id: 'sauna',      icon: '🧖', name: 'Sauna' },
  { id: 'ballet',     icon: '🩰', name: 'Ballet class' },
];

const SUGGESTIONS = [
  { id: 's-sleep',   icon: '😴', name: 'Sleep 7+ hours',               schedule: { type: 'daily' }, why: 'Recovery is where workouts pay off.' },
  { id: 's-protein', icon: '🥚', name: 'Hit my protein goal',          schedule: { type: 'daily' }, why: 'Supports muscle and curbs snacking.' },
  { id: 's-sun',     icon: '☀️', name: 'Morning sunlight 10 min',      schedule: { type: 'daily' }, why: 'Helps energy and your sleep rhythm.' },
  { id: 's-screens', icon: '📵', name: 'No screens 30 min before bed', schedule: { type: 'daily' }, why: 'A simple wind-down for better sleep.' },
  { id: 's-book',    icon: '📖', name: 'Read a book 20 min',           schedule: { type: 'daily' }, why: 'Balances news time with something slower.' },
  { id: 's-journal', icon: '✍️', name: 'Journal / 3 gratitudes',       schedule: { type: 'daily' }, why: 'Two minutes; pairs well with meditation.' },
];

const MOODS = [
  { v: 1, e: '😞', t: 'Rough' }, { v: 2, e: '😕', t: 'Low' }, { v: 3, e: '😐', t: 'Okay' }, { v: 4, e: '🙂', t: 'Good' }, { v: 5, e: '😄', t: 'Great' },
];
const ENERGY = [
  { v: 1, e: '🪫', t: 'Drained' }, { v: 2, e: '🥱', t: 'Tired' }, { v: 3, e: '🙂', t: 'Steady' }, { v: 4, e: '⚡', t: 'Energized' }, { v: 5, e: '🚀', t: 'Buzzing' },
];
const FEEL_TAGS = ['Rested', 'Sore', 'Bloated', 'Focused', 'Stressed', 'Anxious', 'Calm', 'Headache', 'Hungry', 'Cravings', 'Slept badly', 'Motivated'];
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snack', 'Drink'];
const DAY_LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

/* ================= Dates ================= */

const pad = (n) => String(n).padStart(2, '0');
const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const same = (a, b) => dkey(a) === dkey(b);
const weekStart = (d) => addDays(d, -((d.getDay() + 6) % 7));
const isWeekday = (d) => d.getDay() >= 1 && d.getDay() <= 5;
const fmt = (d, o) => d.toLocaleDateString(undefined, o);
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;

/* ================= State ================= */

let config = null;           // { habits, extras, unit, created }
const days = {};             // 'YYYY-MM-DD' -> day doc
let insights = null;         // last Claude analysis
const goals = {};            // 'YYYY-MM' -> { month, items: [{id, text, done}] }
let view = 'today';
let cursor = today();
let weekCursor = weekStart(today());

let store = null;            // backend adapter
let sample = null;           // Claude, or null
let loaded = false;

const blankDay = (k) => ({ date: k, habits: {}, extras: {}, food: [], feel: {}, weight: null, travel: false, where: '' });
const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const getGoals = (mk) => goals[mk] || { month: mk, items: [] };
function editGoals(mk, fn) { const g = structuredClone(getGoals(mk)); fn(g); goals[mk] = g; store.saveGoals(mk, g); }
const getDay = (d) => days[dkey(d)] || blankDay(dkey(d));
function editDay(d, fn) {
  const k = dkey(d);
  const day = structuredClone(days[k] || blankDay(k));
  fn(day);
  days[k] = day;
  store.saveDay(k, day);
}
function saveConfig() { store.saveConfig(config); }

function defaultConfig() {
  return { habits: structuredClone(DEFAULT_HABITS), extras: structuredClone(DEFAULT_EXTRAS), unit: 'lb', created: dkey(today()) };
}

/* ---------- Backends ---------- */

// Writes to one document are serialized; only the latest body is sent.
function makeWriter(writeFn, onError) {
  const pending = new Map(), running = new Set();
  async function flush(id) {
    if (running.has(id)) return;
    running.add(id);
    try {
      while (pending.has(id)) {
        const body = pending.get(id); pending.delete(id);
        try { await writeFn(id, body); }
        catch (e) {
          if (e && e.code === 'unavailable') {
            await new Promise((r) => setTimeout(r, 600 + Math.random() * 800));
            try { await writeFn(id, body); } catch (e2) { onError(e2); }
          } else onError(e);
        }
      }
    } finally { running.delete(id); }
  }
  return { queue(id, body) { pending.set(id, body); flush(id); }, busy: (id) => running.has(id) || pending.has(id) };
}

async function dbBackend(db, uid) {
  const col = db.collection('data/users/' + uid);
  const writer = makeWriter((id, body) => col.doc(id).set(body), (e) => {
    toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Old entries need deleting before new ones save.' : 'Couldn’t save that change. Check your connection and try again.');
  });
  let first = true;
  await new Promise((resolve) => {
    const timer = setTimeout(() => { setBanner('Your data can’t be reached yet. It may be out of date.'); resolve(); }, 10000);
    col.onSnapshot((snap) => {
      for (const doc of snap.docs) {
        const id = doc.id;
        if (writer.busy(id)) continue; // keep the local copy until our write lands
        const data = doc.data();
        if (id === 'config') config = structuredClone(data);
        else if (id === 'insights') insights = structuredClone(data);
        else if (DAY_RE.test(id)) days[id] = structuredClone(data);
        else if (id.startsWith('goals-')) goals[id.slice(6)] = structuredClone(data);
      }
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed' && DAY_RE.test(ch.doc.id) && !writer.busy(ch.doc.id)) delete days[ch.doc.id];
      }
      if (!snap.metadata.fromCache) { clearTimeout(timer); setBanner(''); }
      if (first) { first = false; resolve(); } else if (!editingNow()) render();
    }, (e) => {
      clearTimeout(timer);
      setBanner(e.code === 'revoked' ? '' : 'Live sync stopped. Reload the page to reconnect.');
      resolve();
    });
  });
  return {
    kind: 'cloud',
    saveDay: (k, body) => writer.queue(k, body),
    saveConfig: (c) => writer.queue('config', c),
    saveInsights: (x) => writer.queue('insights', x),
    saveGoals: (mk, g) => writer.queue('goals-' + mk, g),
  };
}

function localBackend() {
  const KEY = 'daily-rhythm.local.v1';
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw) { config = raw.config; Object.assign(days, raw.days || {}); Object.assign(goals, raw.goals || {}); insights = raw.insights || null; }
  } catch (_) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ config, days, goals, insights })); } catch (_) {} };
  return { kind: 'local', saveDay: persist, saveConfig: persist, saveInsights: persist, saveGoals: persist };
}

/* ================= Habit logic ================= */

const isDone = (h, d) => !!getDay(d).habits[h.id];
const isTravel = (d) => !!getDay(d).travel;
const scheduled = (h, d) => h.schedule.type !== 'weekdays' || isWeekday(d);
function weekCount(h, d) { const ws = weekStart(d); let n = 0; for (let i = 0; i < 7; i++) if (isDone(h, addDays(ws, i))) n++; return n; }
function schedLabel(s) { return s.type === 'weekdays' ? 'Weekdays' : s.type === 'weekly' ? (s.times === 1 ? 'Once a week' : `${s.times}× a week`) : 'Every day'; }
function earliest() { let m = config.created; for (const k in days) if (k < m) m = k; return parseKey(m); }

function streak(h) {
  const t = today(), start = earliest();
  if (h.schedule.type === 'weekly') {
    let ws = weekStart(t), n = 0;
    if (weekCount(h, ws) >= h.schedule.times) n++;
    ws = addDays(ws, -7);
    while (ws >= weekStart(start) && weekCount(h, ws) >= h.schedule.times) { n++; ws = addDays(ws, -7); }
    return n;
  }
  let d = isDone(h, t) ? t : addDays(t, -1), n = 0;
  while (d >= start) {
    if (scheduled(h, d)) {
      if (isDone(h, d)) n++;
      else if (!isTravel(d)) break; // a missed habit while traveling doesn't end the streak
    }
    d = addDays(d, -1);
  }
  return n;
}
function rate30(h) {
  const t = today(), start = earliest(); let hit = 0, tot = 0;
  if (h.schedule.type === 'weekly') {
    for (let i = 0; i < 4; i++) { const ws = addDays(weekStart(t), -7 * i); if (addDays(ws, 6) < start) break; const met = weekCount(h, ws) >= h.schedule.times; if (i === 0 && !met) continue; tot++; if (met) hit++; }
  } else {
    for (let i = 0; i < 30; i++) { const d = addDays(t, -i); if (d < start) break; if (!scheduled(h, d)) continue; if (!isDone(h, d) && (i === 0 || isTravel(d))) continue; tot++; if (isDone(h, d)) hit++; }
  }
  return tot ? hit / tot : null;
}
const dayKcal = (day) => day.food.reduce((s, f) => s + (Number(f.cal) || 0), 0);

/* ================= Helpers ================= */

const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let bannerText = '';
function setBanner(t) { if (t !== bannerText) { bannerText = t; if (loaded && !editingNow()) render(); } }
let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2600); }
function editingNow() { const a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'button')); }
const uid = () => Math.random().toString(36).slice(2, 10);

function ring(f) {
  const r = 36, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="track" cx="42" cy="42" r="${r}"/><circle class="bar" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>`;
}

function skyPhase() { const h = new Date().getHours(); return h >= 5 && h < 11 ? 'dawn' : h < 17 ? 'day' : h < 21 ? 'dusk' : 'night'; }
function skyArc() {
  // Decorative: where the sun (or moon) sits in today's arc, 6am to 8pm.
  const n = new Date(), hrs = n.getHours() + n.getMinutes() / 60;
  const night = hrs < 6 || hrs >= 20;
  const f = night ? (hrs >= 20 ? (hrs - 20) / 10 : (hrs + 4) / 10) : (hrs - 6) / 14;
  const x = 115 - 100 * Math.cos(Math.PI * f), y = 108 - 100 * Math.sin(Math.PI * f);
  return `<svg class="arc" viewBox="0 0 230 115" aria-hidden="true"><path d="M15,108 A100,100 0 0 1 215,108"/><circle class="glow" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${night ? 4.5 : 6}"/></svg>`;
}
function hero(top, body = '') {
  return `<header class="hero ${skyPhase()} gutter">${skyArc()}<div class="hero-in">${top}${body}</div></header>`;
}
function dayHero(title, body) {
  const d = cursor, isT = same(d, today());
  const name = isT ? 'Today' : same(d, addDays(today(), -1)) ? 'Yesterday' : fmt(d, { weekday: 'long' });
  return hero(`<div class="hero-top">
    <div class="t"><div class="label">${esc(title)}</div><h1>${esc(name)}</h1>
      <p class="sub">${esc(fmt(d, { weekday: isT ? 'long' : undefined, month: 'long', day: 'numeric' }))}${isT ? '' : ' · <button type="button" class="linkbtn" data-act="go-today">Back to today</button>'}</p></div>
    <button type="button" class="round" data-act="prev-day" aria-label="Previous day">‹</button>
    <button type="button" class="round" data-act="next-day" aria-label="Next day" ${isT ? 'disabled' : ''}>›</button>
  </div>`, body);
}
function pageHero(label, title) {
  return hero(`<div class="hero-top"><div class="t"><div class="label">${esc(label)}</div><h1>${esc(title)}</h1></div></div>`);
}

function banner() {
  const parts = [];
  if (bannerText) parts.push(bannerText);
  if (store && store.kind === 'local') parts.push('Open this page in Claude to sync across devices. Until then, entries save in this browser only.');
  return parts.map((p) => `<div class="banner">${esc(p)}</div>`).join('');
}

/* ================= Today ================= */

function renderToday() {
  const d = cursor, day = getDay(d), habits = config.habits;
  const on = habits.filter((h) => scheduled(h, d)), off = habits.filter((h) => !scheduled(h, d));
  const complete = (h) => isDone(h, d) || (h.schedule.type === 'weekly' && weekCount(h, d) >= h.schedule.times);
  const done = on.filter(complete).length, total = on.length;
  const kcal = dayKcal(day);
  const mood = MOODS.find((m) => m.v === day.feel.mood);
  const extrasDone = config.extras.filter((x) => day.extras[x.id]);

  const row = (h) => {
    const dn = isDone(h, d); let meta = schedLabel(h.schedule), cls = '';
    if (h.schedule.type === 'weekly') { const c = weekCount(h, d), met = c >= h.schedule.times; meta = `${c} of ${h.schedule.times} this week${met ? ' ✓' : ''}`; if (met && !dn) cls = 'met'; }
    if (!scheduled(h, d)) { cls = 'off'; meta = 'Weekdays only'; }
    const s = scheduled(h, d) ? streak(h) : 0;
    const unit = h.schedule.type === 'weekly' ? (s === 1 ? 'week' : 'weeks') : (s === 1 ? 'day' : 'days');
    return `<li><button type="button" class="habit ${cls}" role="checkbox" aria-checked="${dn}" data-habit="${esc(h.id)}">
      <span class="emo" style="--hue: var(--h${config.habits.indexOf(h) % 6 + 1})" aria-hidden="true">${esc(h.icon)}</span>
      <span class="body"><span class="name">${esc(h.name)}</span><span class="meta">${esc(meta)}${s ? ` · <span class="flame">🔥 ${s} ${unit}</span>` : ''}</span></span>
      <span class="tick" aria-hidden="true">✓</span></button></li>`;
  };

  const ytd = getDay(addDays(d, -1));
  const travelCard = `<section class="card travel ${day.travel ? 'on' : ''}">
      <div class="travel-top">
        <button type="button" class="pill" data-act="travel-toggle" aria-pressed="${!!day.travel}"><span aria-hidden="true">✈️</span>${day.travel ? 'Traveling' : 'Traveling today?'}</button>
        ${day.travel
          ? `<input type="text" id="travel-where" class="grow" maxlength="60" placeholder="Where? (optional)" value="${esc(day.where || '')}" aria-label="Where are you?">`
          : ytd.travel ? `<span class="small muted grow">Yesterday: ${esc(ytd.where || 'traveling')}. Still away? Tap to continue.</span>` : `<span class="small muted grow">Missed habits won't break streaks on travel days.</span>`}
      </div>
      ${day.travel ? '<span class="small muted">Streaks are paused for anything you skip today. Anything you do still counts.</span>' : ''}
    </section>`;

  const mk = monthKey(d), g = getGoals(mk);
  const monthName = fmt(d, { month: 'long' });
  const gDone = g.items.filter((x) => x.done).length;
  const goalsCard = `<section class="card section">
      <div class="section-head" style="padding:0"><h2>${esc(monthName)} goals</h2>${g.items.length ? `<span class="small muted num">${gDone} of ${g.items.length} done</span>` : ''}</div>
      ${g.items.length ? `<div class="goal-bar"><i style="width:${Math.round((gDone / g.items.length) * 100)}%"></i></div>` : ''}
      ${g.items.length ? `<div>${g.items.map((x) => `<div class="goal ${x.done ? 'done' : ''}">
          <button type="button" class="gtick" role="checkbox" aria-checked="${!!x.done}" data-goal="${esc(x.id)}" aria-label="${esc(x.text)}">✓</button>
          <span class="gtext">${esc(x.text)}</span>
          <button type="button" class="gdel" data-goal-del="${esc(x.id)}" aria-label="Remove goal: ${esc(x.text)}">✕</button></div>`).join('')}</div>`
        : `<p class="small muted" style="margin:0">What do you want this month to be about? For example: run 4 times, lose 2 lb, try a new ballet class.</p>`}
      ${g.items.length < 12 ? `<form class="row" id="goal-form" autocomplete="off"><input type="text" id="goal-input" class="grow" maxlength="120" placeholder="Add a goal for ${esc(monthName)}"><button type="submit" class="btn">Add</button></form>` : ''}
    </section>`;

  const weekExtras = (x) => { const ws = weekStart(d); let n = 0; for (let i = 0; i < 7; i++) if (getDay(addDays(ws, i)).extras[x.id]) n++; return n; };

  const energy = ENERGY.find((m) => m.v === day.feel.energy);
  app.innerHTML = `
    ${dayHero('Daily rhythm', `<div class="hero-stats">
        <div class="hero-ring">${ring(total ? done / total : 0)}<b class="num">${done}/${total}<small>HABITS</small></b></div>
        <div class="tiles">
          <div class="tile"><span class="k">Food</span><span class="v num">${kcal ? kcal.toLocaleString() : '—'}</span></div>
          <div class="tile"><span class="k">Mood</span><span class="v word">${mood ? mood.e + ' ' + esc(mood.t) : '—'}</span></div>
          <div class="tile"><span class="k">Weight</span><span class="v num">${day.weight ?? '—'}</span></div>
        </div>
      </div>
      ${day.travel || extrasDone.length || energy ? `<div class="hero-chips">
        ${day.travel ? `<span class="hchip">✈️ ${esc(day.where || 'Traveling')}</span>` : ''}
        ${energy ? `<span class="hchip">${energy.e} ${esc(energy.t)}</span>` : ''}
        ${extrasDone.map((x) => `<span class="hchip">${esc(x.icon)} ${esc(x.name)}</span>`).join('')}
      </div>` : ''}`)}
    <div class="wrap">
    ${banner()}

    ${travelCard}
    ${goalsCard}

    <section class="section">
      <div class="section-head"><span class="label">Daily habits</span></div>
      <ul class="list">${on.map(row).join('')}</ul>
      ${off.length ? `<div class="section-head"><span class="label">Rest day</span></div><ul class="list">${off.map(row).join('')}</ul>` : ''}
    </section>

    <section class="section">
      <div class="section-head"><span class="label">Extras</span><span class="small muted">Not required, just tracked</span></div>
      <div class="extras">${config.extras.map((x) => { const c = weekExtras(x); return `<button type="button" class="pill" aria-pressed="${!!day.extras[x.id]}" data-extra="${esc(x.id)}"><span aria-hidden="true">${esc(x.icon)}</span>${esc(x.name)}${c ? `<span class="c">${c}× this wk</span>` : ''}</button>`; }).join('') || '<span class="muted small">Add extras on the Habits tab.</span>'}</div>
    </section>
    </div>
  `;
}

/* ================= Food ================= */

let foodDraft = { text: '', meal: guessMeal(), photo: null };

async function estimateFood(dateKey, id) {
  const d = parseKey(dateKey);
  const f = getDay(d).food.find((x) => x.id === id);
  if (!f || !sample) return;
  estimating.add(id); if (view === 'food') render();
  const photo = photos.get(id);
  const prompt = `Estimate the nutrition of this food a person logged as their ${f.meal.toLowerCase()}.
Food description: "${(f.text || '').slice(0, 1500) || '(see photo)'}"
Assume typical home or restaurant US portion sizes unless amounts are given. Be realistic, not conservative.
Reply with only JSON in this shape:
{"items":[{"name":"short item name","cal":120}],"cal":total_kcal_integer,"protein":total_protein_grams_integer,"note":"one short sentence on assumptions, or empty"}`;
  try {
    const opts = { modelTier: photo ? 'default' : 'quick' };
    if (photo) opts.images = photo;
    const r = await sample.json(prompt, opts);
    const cal = Math.round(Number(r && r.cal));
    if (!Number.isFinite(cal)) throw { code: 'invalid_json' };
    editDay(d, (day) => {
      const x = day.food.find((y) => y.id === id); if (!x) return;
      x.cal = cal;
      x.protein = Number.isFinite(Number(r.protein)) ? Math.round(Number(r.protein)) : null;
      x.items = Array.isArray(r.items) ? r.items.slice(0, 12).map((i) => ({ name: String(i.name || '').slice(0, 60), cal: Math.round(Number(i.cal) || 0) })) : [];
      x.note = String(r.note || '').slice(0, 200);
      x.estimated = true;
    });
  } catch (e) {
    toast(sampleError(e, 'estimate calories'));
  } finally {
    estimating.delete(id); if (view === 'food') render();
  }
}

function sampleError(e, what) {
  switch (e && e.code) {
    case 'not_granted': return `Claude wasn’t allowed to ${what}. You can enter calories yourself.`;
    case 'rate_limited': return 'Claude is busy right now. Try again in a minute.';
    case 'cancelled': return 'Stopped.';
    case 'invalid_json': return `Claude’s answer couldn’t be read. Try again.`;
    case 'image_rejected': return 'That photo couldn’t be used. Try a JPEG or PNG.';
    default: return `Couldn’t ${what} right now. Try again later.`;
  }
}

function lastWeightBefore(d) {
  const k = dkey(d);
  const keys = Object.keys(days).filter((x) => x < k && days[x].weight).sort();
  const last = keys[keys.length - 1];
  return last ? { d: parseKey(last), w: days[last].weight } : null;
}

/* ================= Insights ================= */

let aiBusy = false, aiCtl = null;

function dayRows(n) {
  const t = today(), out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = addDays(t, -i), k = dkey(d), day = days[k];
    if (!day) continue;
    const hasAny = Object.keys(day.habits).length || Object.keys(day.extras).length || day.food.length || day.feel.mood || day.weight || day.travel;
    if (!hasAny) continue;
    out.push({ d, k, day });
  }
  return out;
}

function compareTable() {
  // Average mood/energy on days a habit was done vs. scheduled but not done.
  const rows = dayRows(60).filter((r) => r.day.feel.mood);
  const out = [];
  const items = [...config.habits.map((h) => ({ ...h, kind: 'h' })), ...config.extras.map((x) => ({ ...x, kind: 'x' })), { id: 'travel', icon: '✈️', name: 'Traveling', kind: 't' }];
  for (const h of items) {
    const yes = [], no = [];
    for (const r of rows) {
      if (h.kind === 'h' && !scheduled(h, r.d)) continue;
      const did = h.kind === 'h' ? !!r.day.habits[h.id] : h.kind === 't' ? !!r.day.travel : !!r.day.extras[h.id];
      (did ? yes : no).push(r.day.feel.mood);
    }
    if (yes.length >= 3 && no.length >= 3) {
      const a = yes.reduce((s, v) => s + v, 0) / yes.length, b = no.reduce((s, v) => s + v, 0) / no.length;
      out.push({ h, a, b, diff: a - b, n: yes.length + no.length });
    }
  }
  return out.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff)).slice(0, 8);
}

function weightChart() {
  const pts = Object.keys(days).filter((k) => days[k].weight && parseKey(k) >= addDays(today(), -89)).sort().map((k) => ({ d: parseKey(k), w: Number(days[k].weight) }));
  if (pts.length < 2) return `<p class="muted small">Log your weight on the Check-in tab. A trend line appears after two entries.</p>`;
  const W = 360, H = 170, L = 34, R = 10, T = 12, B = 24;
  const t0 = pts[0].d.getTime(), t1 = pts[pts.length - 1].d.getTime();
  let lo = Math.min(...pts.map((p) => p.w)), hi = Math.max(...pts.map((p) => p.w));
  const padv = Math.max(1, (hi - lo) * 0.15); lo = Math.floor(lo - padv); hi = Math.ceil(hi + padv);
  const x = (d) => L + (t1 === t0 ? (W - L - R) / 2 : ((d.getTime() - t0) / (t1 - t0)) * (W - L - R));
  const y = (w) => T + (1 - (w - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  const area = `${path}L${x(pts[pts.length - 1].d).toFixed(1)},${H - B}L${x(pts[0].d).toFixed(1)},${H - B}Z`;
  const last = pts[pts.length - 1];
  const change = +(last.w - pts[0].w).toFixed(1);
  chartPts = pts.map((p) => ({ x: x(p.d), y: y(p.w), label: `${fmt(p.d, { month: 'short', day: 'numeric' })}: ${p.w} ${config.unit}` }));
  return `<div class="row" style="justify-content:space-between"><span class="small muted">Last ${Math.round((t1 - t0) / 864e5) + 1} days</span>
      <span class="small num" style="font-weight:700">${change > 0 ? '+' : ''}${change} ${esc(config.unit)}</span></div>
    <div class="chart" id="wchart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${pts[0].w} to ${last.w} ${esc(config.unit)}">
        <g class="grid">${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}</g>
        <path class="area" d="${area}"/><path class="line" d="${path}"/>
        <text x="${L}" y="${H - 6}">${esc(fmt(pts[0].d, { month: 'short', day: 'numeric' }))}</text>
        <text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmt(last.d, { month: 'short', day: 'numeric' }))}</text>
        <circle class="pt" cx="${x(last.d)}" cy="${y(last.w)}" r="4.5"/>
        <line class="cross" id="wcross" y1="${T}" y2="${H - B}" x1="-10" x2="-10"/>
        <circle class="pt" id="wdot" r="4.5" cx="-10" cy="-10"/>
        <rect id="whit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
      </svg>
      <div class="tip" id="wtip" hidden></div>
    </div>`;
}
let chartPts = [];
function wireChart() {
  const svg = document.querySelector('#wchart svg'); if (!svg) return;
  const tip = document.getElementById('wtip'), cross = document.getElementById('wcross'), dot = document.getElementById('wdot');
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const px = ((ev.clientX - r.left) / r.width) * vb.width;
    let best = chartPts[0]; for (const p of chartPts) if (Math.abs(p.x - px) < Math.abs(best.x - px)) best = p;
    cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y);
    tip.hidden = false; tip.textContent = best.label;
    tip.style.left = `${(best.x / vb.width) * r.width}px`; tip.style.top = `${(best.y / vb.height) * r.height}px`;
  };
  const hide = () => { tip.hidden = true; cross.setAttribute('x1', -10); cross.setAttribute('x2', -10); dot.setAttribute('cx', -10); };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', hide);
}

async function runInsights() {
  if (!sample || aiBusy) return;
  const rows = dayRows(30);
  const habitNames = Object.fromEntries(config.habits.map((h) => [h.id, h.name]));
  const extraNames = Object.fromEntries(config.extras.map((x) => [x.id, x.name]));
  const lines = rows.map(({ d, k, day }) => {
    const sched = config.habits.filter((h) => scheduled(h, d) && h.schedule.type !== 'weekly');
    const doneH = Object.keys(day.habits).map((id) => habitNames[id]).filter(Boolean);
    const missed = sched.filter((h) => !day.habits[h.id]).map((h) => h.name);
    const ex = Object.keys(day.extras).map((id) => extraNames[id]).filter(Boolean);
    const food = day.food.map((f) => `${f.meal}: ${(f.text || 'photo').slice(0, 80)}${f.cal != null ? ` (${f.cal} kcal)` : ''}`);
    const f = day.feel || {};
    return [
      `${k} (${fmt(d, { weekday: 'short' })})${day.travel ? ` TRAVELING${day.where ? ' in ' + day.where.slice(0, 40) : ''}` : ''}`,
      `done: ${doneH.join(', ') || 'none'}`,
      `missed: ${missed.join(', ') || 'none'}`,
      ex.length ? `extras: ${ex.join(', ')}` : '',
      food.length ? `food (${dayKcal(day)} kcal total): ${food.join('; ')}` : 'food: not logged',
      f.mood ? `mood ${f.mood}/5` : 'mood: not logged',
      f.energy ? `energy ${f.energy}/5` : '',
      f.tags && f.tags.length ? `feelings: ${f.tags.join(', ')}` : '',
      f.note ? `note: "${f.note.slice(0, 240)}"` : '',
      day.weight ? `weight ${day.weight} ${config.unit}` : '',
    ].filter(Boolean).join(' | ');
  });
  const prompt = `You are helping someone understand how their daily habits and food relate to how they feel. Below is their personal log, one line per day (oldest first). Mood and energy are self-rated 1-5.

Their habits: ${config.habits.map((h) => `${h.name} (${schedLabel(h.schedule)})`).join('; ')}.
Optional extras they track: ${config.extras.map((x) => x.name).join(', ') || 'none'}.
Their goals for ${fmt(today(), { month: 'long' })}: ${getGoals(monthKey(today())).items.map((x) => `${x.text}${x.done ? ' (done)' : ''}`).join('; ') || 'none set'}.
Days marked TRAVELING are away from home; their routine differs then, so don't treat travel-day misses as failures. Do compare how travel days and the days right after travel affect mood, energy, food and weight.

LOG:
${lines.join('\n')}

Find the most useful patterns linking habits, extras, food (what and how much), and next-day effects to mood, energy, feelings and weight. Look at same-day and next-day effects (e.g. sauna or a late heavy dinner affecting the next day). Be specific and cite numbers from the log (e.g. "mood averaged 4.2 on the 6 days you meditated vs 3.1 otherwise"). Only claim what the data supports; with few days, say evidence is weak. No medical claims. Write warmly and directly to the person ("you").

Reply with only JSON:
{"summary":"2 sentences max","goalProgress":"1-2 sentences on how the log suggests their monthly goals are going, or empty if none set","findings":[{"title":"short headline","detail":"1-2 sentences with numbers","direction":"positive|negative|neutral","confidence":"strong|moderate|weak"}],"suggestions":["concrete, small next step", "..."]}
Give 3-6 findings and 2-3 suggestions.`;

  aiBusy = true; aiCtl = new AbortController(); render();
  try {
    const r = await sample.json(prompt, { signal: aiCtl.signal });
    if (!r || !Array.isArray(r.findings)) throw { code: 'invalid_json' };
    insights = {
      summary: String(r.summary || '').slice(0, 600),
      goalProgress: String(r.goalProgress || '').slice(0, 500),
      findings: r.findings.slice(0, 8).map((x) => ({ title: String(x.title || '').slice(0, 120), detail: String(x.detail || '').slice(0, 500), direction: String(x.direction || 'neutral'), confidence: String(x.confidence || '') })),
      suggestions: Array.isArray(r.suggestions) ? r.suggestions.slice(0, 4).map((s) => String(s).slice(0, 240)) : [],
      days: rows.length, at: new Date().toISOString(),
    };
    store.saveInsights(insights);
  } catch (e) {
    if (e && e.code !== 'cancelled') toast(sampleError(e, 'find patterns'));
  } finally {
    aiBusy = false; aiCtl = null; if (view === 'insights') render();
  }
}

/* ================= Manage ================= */

let confirmDelete = null; // 'h:id' | 'x:id' | 'reset'

function renderManage() {
  const names = new Set(config.habits.map((h) => h.name.toLowerCase()));
  const sugg = SUGGESTIONS.filter((s) => !config.habits.some((h) => h.id === s.id) && !names.has(s.name.toLowerCase()));
  const n = config.habits.length;
  const delBtn = (key, name) => confirmDelete === key
    ? `<span class="confirm"><button type="button" class="btn sm danger" data-del-yes="${esc(key)}">Delete</button><button type="button" class="btn sm ghost" data-del-no>Keep</button></span>`
    : `<button type="button" class="mini danger" data-del="${esc(key)}" aria-label="Delete ${esc(name)}">✕</button>`;

  app.innerHTML = `
    ${pageHero(`${n} habits · ${config.extras.length} extras`, 'Habits')}
    <div class="wrap">
    ${banner()}

    <section class="card">
      <div class="section-head" style="padding:0 0 4px"><h2>Daily habits</h2><button type="button" class="btn sm primary" data-act="add-habit">+ Add</button></div>
      ${config.habits.map((h, i) => `<div class="mrow"><span class="e" aria-hidden="true">${esc(h.icon)}</span>
        <span class="b"><strong>${esc(h.name)}</strong><span class="small muted">${schedLabel(h.schedule)}</span></span>
        ${confirmDelete === 'h:' + h.id ? '' : `<button type="button" class="mini" data-move="${esc(h.id)}|-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="mini" data-move="${esc(h.id)}|1" aria-label="Move down" ${i === n - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="mini" data-edit="h:${esc(h.id)}" aria-label="Edit ${esc(h.name)}">✎</button>`}
        ${delBtn('h:' + h.id, h.name)}</div>`).join('')}
    </section>

    <section class="card">
      <div class="section-head" style="padding:0 0 4px"><h2>Extras</h2><button type="button" class="btn sm primary" data-act="add-extra">+ Add</button></div>
      <p class="small muted" style="margin:0 0 4px">Things you track when they happen, like classes or sessions. Never counted as missed.</p>
      ${config.extras.map((x) => `<div class="mrow"><span class="e" aria-hidden="true">${esc(x.icon)}</span><span class="b"><strong>${esc(x.name)}</strong></span>
        ${confirmDelete === 'x:' + x.id ? '' : `<button type="button" class="mini" data-edit="x:${esc(x.id)}" aria-label="Edit ${esc(x.name)}">✎</button>`}
        ${delBtn('x:' + x.id, x.name)}</div>`).join('')}
    </section>

    ${sugg.length ? `<section class="card"><h2 style="margin-bottom:4px">More ideas</h2>
      ${sugg.map((s) => `<div class="mrow"><span class="e" aria-hidden="true">${esc(s.icon)}</span><span class="b"><strong>${esc(s.name)}</strong><span class="small muted">${esc(s.why)}</span></span><button type="button" class="btn sm" data-suggest="${esc(s.id)}">Add</button></div>`).join('')}
    </section>` : ''}

    <section class="card section">
      <h2>Your data</h2>
      <p class="small muted" style="margin:0">${store.kind === 'cloud' ? 'Saved privately to your Claude account. Only you can see it, and it syncs wherever you open this page.' : 'Saved in this browser only.'}</p>
      <div class="row">${confirmDelete === 'reset'
        ? `<span class="small">Reset your habit list to the defaults? Your history stays.</span><button type="button" class="btn sm danger" data-del-yes="reset">Reset list</button><button type="button" class="btn sm ghost" data-del-no>Cancel</button>`
        : `<button type="button" class="btn sm danger" data-del="reset">Reset habit list to defaults</button>`}</div>
    </section>
    </div>
  `;
}

function openSheet(kind, item) {
  const isHabit = kind === 'h';
  const root = document.getElementById('sheet-root');
  const s = item && item.schedule ? item.schedule : { type: 'daily' };
  root.innerHTML = `<div class="sheet-bg" data-sheet-bg><form class="sheet" id="sheet-form" autocomplete="off">
    <h2>${item ? 'Edit' : 'Add'} ${isHabit ? 'habit' : 'extra'}</h2>
    <label class="field"><span>Name</span><input type="text" id="sf-name" required maxlength="60" value="${esc(item ? item.name : '')}" placeholder="${isHabit ? 'e.g. Drink water' : 'e.g. Pilates class'}"></label>
    <label class="field"><span>Emoji</span><input type="text" id="sf-icon" maxlength="8" value="${esc(item ? item.icon : '')}" placeholder="✨"></label>
    ${isHabit ? `<label class="field"><span>How often</span><select id="sf-type">
        <option value="daily" ${s.type === 'daily' ? 'selected' : ''}>Every day</option>
        <option value="weekdays" ${s.type === 'weekdays' ? 'selected' : ''}>Weekdays only (Mon–Fri)</option>
        <option value="weekly" ${s.type === 'weekly' ? 'selected' : ''}>A number of times per week</option></select></label>
      <label class="field" id="sf-times-wrap" ${s.type === 'weekly' ? '' : 'hidden'}><span>Times per week</span><input type="number" id="sf-times" min="1" max="7" value="${s.times || 3}"></label>` : ''}
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-sheet-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form></div>`;
  const form = document.getElementById('sheet-form');
  const type = document.getElementById('sf-type');
  if (type) type.addEventListener('change', () => { document.getElementById('sf-times-wrap').hidden = type.value !== 'weekly'; });
  root.querySelector('[data-sheet-close]').onclick = closeSheet;
  root.querySelector('[data-sheet-bg]').addEventListener('click', (e) => { if (e.target.hasAttribute('data-sheet-bg')) closeSheet(); });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('sf-name').value.trim(); if (!name) return;
    const icon = document.getElementById('sf-icon').value.trim() || (isHabit ? '✅' : '✨');
    const list = isHabit ? config.habits : config.extras;
    let entry = item ? list.find((x) => x.id === item.id) : null;
    if (!entry) { entry = { id: (isHabit ? 'h-' : 'x-') + uid() }; list.push(entry); }
    entry.name = name; entry.icon = icon;
    if (isHabit) {
      const t = type.value;
      entry.schedule = t === 'weekly' ? { type: t, times: Math.min(7, Math.max(1, parseInt(document.getElementById('sf-times').value, 10) || 1)) } : { type: t };
    }
    saveConfig(); closeSheet(); render(); toast(item ? 'Saved' : 'Added');
  });
  setTimeout(() => document.getElementById('sf-name').focus(), 30);
}
function closeSheet() { document.getElementById('sheet-root').innerHTML = ''; }

/* ================= Router & events ================= */

function render() {
  if (!loaded) return;
  ({ today: renderToday, food: renderFood, feel: renderFeel, insights: renderInsights, manage: renderManage }[view] || renderToday)();
  document.querySelectorAll('.tab').forEach((b) => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
}
function setView(v) {
  view = v; confirmDelete = null;
  try { sessionStorage.setItem('daily-rhythm.view', v); } catch (_) {}
  try { if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); } catch (_) {}
  document.getElementById('scroller').scrollTo(0, 0); render();
}

document.querySelector('.tabbar').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) setView(b.dataset.view); });

app.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset;

  if (ds.habit) { const h = config.habits.find((x) => x.id === ds.habit); if (h) { editDay(cursor, (d) => { if (d.habits[h.id]) delete d.habits[h.id]; else d.habits[h.id] = true; }); render(); } return; }
  if (ds.extra) { editDay(cursor, (d) => { if (d.extras[ds.extra]) delete d.extras[ds.extra]; else d.extras[ds.extra] = true; }); render(); return; }
  if (ds.cell) { const [id, k] = ds.cell.split('|'); editDay(parseKey(k), (d) => { if (d.habits[id]) delete d.habits[id]; else d.habits[id] = true; }); render(); return; }
  if (ds.meal) { foodDraft.meal = ds.meal; foodDraft.text = document.getElementById('food-text').value; render(); return; }
  if (ds.feel) { const v = Number(ds.v); editDay(cursor, (d) => { d.feel = d.feel || {}; d.feel[ds.feel] = d.feel[ds.feel] === v ? null : v; }); render(); return; }
  if (ds.tag) { editDay(cursor, (d) => { d.feel = d.feel || {}; const t = new Set(d.feel.tags || []); t.has(ds.tag) ? t.delete(ds.tag) : t.add(ds.tag); d.feel.tags = [...t]; }); render(); return; }
  if (ds.unit) { config.unit = ds.unit; saveConfig(); render(); return; }
  if (ds.move) { const [id, dir] = ds.move.split('|'); const i = config.habits.findIndex((h) => h.id === id), j = i + Number(dir); if (i >= 0 && j >= 0 && j < config.habits.length) { [config.habits[i], config.habits[j]] = [config.habits[j], config.habits[i]]; saveConfig(); render(); } return; }
  if (ds.edit) { const [k, id] = ds.edit.split(':'); openSheet(k, (k === 'h' ? config.habits : config.extras).find((x) => x.id === id)); return; }
  if (ds.del) { confirmDelete = ds.del; render(); return; }
  if ('delNo' in ds) { confirmDelete = null; render(); return; }
  if (ds.delYes) {
    const key = ds.delYes;
    if (key === 'reset') { config.habits = structuredClone(DEFAULT_HABITS); config.extras = structuredClone(DEFAULT_EXTRAS); toast('Habit list reset'); }
    else { const [k, id] = key.split(':'); if (k === 'h') config.habits = config.habits.filter((x) => x.id !== id); else config.extras = config.extras.filter((x) => x.id !== id); toast('Deleted'); }
    confirmDelete = null; saveConfig(); render(); return;
  }
  if (ds.goal) { editGoals(monthKey(cursor), (g) => { const x = g.items.find((y) => y.id === ds.goal); if (x) x.done = !x.done; }); render(); return; }
  if (ds.goalDel) { editGoals(monthKey(cursor), (g) => { g.items = g.items.filter((y) => y.id !== ds.goalDel); }); render(); return; }
  if (ds.suggest) { const s = SUGGESTIONS.find((x) => x.id === ds.suggest); if (s) { config.habits.push({ id: s.id, name: s.name, icon: s.icon, schedule: structuredClone(s.schedule) }); saveConfig(); render(); toast(`Added ${s.name}`); } return; }

  const foodId = b.closest('[data-food]')?.dataset.food;
  switch (ds.act) {
    case 'prev-day': cursor = addDays(cursor, -1); render(); break;
    case 'next-day': if (cursor < today()) { cursor = addDays(cursor, 1); render(); } break;
    case 'go-today': cursor = today(); render(); break;
    case 'prev-week': weekCursor = addDays(weekCursor, -7); render(); break;
    case 'next-week': if (weekCursor < weekStart(today())) { weekCursor = addDays(weekCursor, 7); render(); } break;
    case 'add-habit': openSheet('h', null); break;
    case 'add-extra': openSheet('x', null); break;
    case 'photo-clear': foodDraft.photo = null; foodDraft.text = document.getElementById('food-text').value; render(); break;
    case 'food-del': editDay(cursor, (d) => { d.food = d.food.filter((f) => f.id !== foodId); }); render(); break;
    case 'food-reestimate': estimateFood(dkey(cursor), foodId); break;
    case 'food-edit': {
      const f = getDay(cursor).food.find((x) => x.id === foodId); if (!f) break;
      const acts = b.closest('.acts');
      acts.innerHTML = `<form class="row" data-calform="${esc(foodId)}"><input type="number" inputmode="numeric" min="0" max="10000" value="${f.cal ?? ''}" aria-label="Calories" style="width:110px"><button type="submit" class="btn sm primary">Save</button><button type="button" class="btn sm ghost" data-act="food-cancel">Cancel</button></form>`;
      acts.querySelector('input').focus();
      break;
    }
    case 'food-cancel': render(); break;
    case 'travel-toggle': {
      const ytd = getDay(addDays(cursor, -1));
      editDay(cursor, (d) => { d.travel = !d.travel; if (d.travel && !d.where && ytd.travel) d.where = ytd.where || ''; });
      render(); break;
    }
    case 'weight-clear': editDay(cursor, (d) => { d.weight = null; }); render(); break;
    case 'ai-run': runInsights(); break;
    case 'ai-stop': aiCtl?.abort(); break;
  }
});

app.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.id === 'food-form') {
    const text = document.getElementById('food-text').value.trim();
    const photo = foodDraft.photo;
    if (!text && !photo) { toast('Describe what you ate, or add a photo.'); return; }
    const calInput = document.getElementById('food-cal');
    const manual = calInput && calInput.value !== '' ? Math.round(Number(calInput.value)) : null;
    const entry = { id: 'f' + uid(), text: text.slice(0, 500), meal: foodDraft.meal, cal: manual, protein: null, items: [], at: new Date().toISOString(), photoName: photo ? photo.name.slice(0, 80) : '' };
    const k = dkey(cursor);
    editDay(cursor, (d) => d.food.push(entry));
    foodDraft = { text: '', meal: foodDraft.meal, photo: null };
    render();
    if (sample) {
      // Attach the photo in memory for this one estimate; it is never stored.
      if (photo) photos.set(entry.id, photo);
      estimateFood(k, entry.id).finally(() => photos.delete(entry.id));
    }
    return;
  }
  if (form.dataset.calform) {
    const v = form.querySelector('input').value; const id = form.dataset.calform;
    editDay(cursor, (d) => { const f = d.food.find((x) => x.id === id); if (f) { f.cal = v === '' ? null : Math.max(0, Math.round(Number(v))); f.estimated = false; } });
    render(); return;
  }
  if (form.id === 'goal-form') {
    const text = document.getElementById('goal-input').value.trim(); if (!text) return;
    editGoals(monthKey(cursor), (g) => g.items.push({ id: 'g' + uid(), text: text.slice(0, 120), done: false }));
    render(); setTimeout(() => document.getElementById('goal-input')?.focus(), 0); return;
  }
  if (form.id === 'weight-form') {
    const v = parseFloat(document.getElementById('weight-input').value);
    if (!Number.isFinite(v) || v < 20 || v > 700) { toast('Enter a weight between 20 and 700.'); return; }
    editDay(cursor, (d) => { d.weight = Math.round(v * 10) / 10; });
    document.activeElement?.blur(); render(); toast('Weight saved'); return;
  }
});

app.addEventListener('input', (e) => {
  if (e.target.id === 'food-text') foodDraft.text = e.target.value;
  if (e.target.id === 'feel-note') {
    const val = e.target.value, d = cursor;
    const out = document.getElementById('note-saved'); if (out) out.textContent = 'Saving…';
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      editDay(d, (day) => { day.feel = day.feel || {}; day.feel.note = val.slice(0, 2000); });
      const o = document.getElementById('note-saved'); if (o) o.textContent = 'Saved';
    }, 700);
  }
});

app.addEventListener('change', (e) => {
  if (e.target.id === 'travel-where') { const v = e.target.value.trim().slice(0, 60); editDay(cursor, (d) => { d.where = v; }); render(); return; }
  if (e.target.id === 'food-photo' && e.target.files[0]) {
    foodDraft.photo = e.target.files[0];
    foodDraft.text = document.getElementById('food-text').value;
    render();
  }
});

app.addEventListener('focusout', (e) => {
  // Flush a pending note immediately when leaving the field.
  if (e.target.id === 'feel-note' && noteTimer) {
    clearTimeout(noteTimer); noteTimer = null;
    const val = e.target.value;
    editDay(cursor, (day) => { day.feel = day.feel || {}; day.feel.note = val.slice(0, 2000); });
  }
});

window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== view && ['today', 'food', 'feel', 'insights', 'manage'].includes(v)) setView(v); });

let lastToday = dkey(today());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = dkey(today()); if (t === lastToday) return;
  if (dkey(cursor) === lastToday) cursor = today();
  if (same(weekCursor, weekStart(parseKey(lastToday)))) weekCursor = weekStart(today());
  lastToday = t; render();
});

/* ================= Boot ================= */

(async function boot() {
  const h = location.hash.slice(1);
  let v = ['today', 'food', 'feel', 'insights', 'manage'].includes(h) ? h : null;
  if (!v) try { v = sessionStorage.getItem('daily-rhythm.view'); } catch (_) {}
  if (['today', 'food', 'feel', 'insights', 'manage'].includes(v)) view = v;

  const hasClaude = !!(window.claude && window.claude.use);
  const [db, user, smp] = hasClaude
    ? await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('sample')].map((p) => p.catch(() => null)))
    : [null, null, null];
  sample = smp;
  const id = user ? await user.id().catch(() => null) : null;

  if (db && id) {
    try { store = await dbBackend(db, id); } catch (_) { store = localBackend(); }
  } else {
    store = localBackend();
  }
  if (!config || !Array.isArray(config.habits)) { config = defaultConfig(); saveConfig(); }
  config.extras ||= structuredClone(DEFAULT_EXTRAS);
  config.unit ||= 'lb';
  for (const k in days) { const d = days[k]; d.habits ||= {}; d.extras ||= {}; d.food ||= []; d.feel ||= {}; }
  loaded = true;
  render();
})();
</script>
